name: Cloud Sentry CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8
          pip install -r cloud-attack-detection/requirements.txt

      - name: Lint (syntax errors only)
        run: |
          flake8 cloud-attack-detection --select=E9,F63,F7,F82 --show-source

      - name: Run integration tests
        working-directory: cloud-attack-detection
        run: python test_sentry.py

  docker:
    name: Docker Build Verification
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./cloud-attack-detection
          push: false
          tags: cloud-sentry:latest
