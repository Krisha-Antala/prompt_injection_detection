services:
  - type: web
    name: prompt-injection-detection
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "false"
    # Persistent disk for SQLite + downloaded models
    disk:
      name: data-disk
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  # Optional: separate background worker for training (free tier allows 1 web + 1 worker)
  - type: worker
    name: training-worker
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python -c "
import os
os.makedirs('data', exist_ok=True)
os.makedirs('models', exist_ok=True)
print('Worker ready - training triggered via web service')
# In production, use a task queue (Redis/RQ) to trigger train_model()
"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9